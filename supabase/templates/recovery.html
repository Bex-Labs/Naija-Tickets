<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fffaf0;font-family:Arial,sans-serif;color:#241b3f">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e2d8">
            <tr>
              <td style="padding:32px">
                <div style="font-size:22px;font-weight:800;color:#14532d">Naija Tickets</div>
                <h1 style="margin:32px 0 12px;font-size:30px;line-height:1.2">Reset your password</h1>
                <p style="margin:0 0 24px;color:#5f6470;line-height:1.7">
                  Use the secure link below to choose a new password for your Naija Tickets account.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#10b981;color:#052e1a;padding:14px 20px;text-decoration:none;font-weight:800">
                  Reset password
                </a>
                <p style="margin:28px 0 0;color:#7b8190;font-size:13px;line-height:1.6">
                  If you did not request a password reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
